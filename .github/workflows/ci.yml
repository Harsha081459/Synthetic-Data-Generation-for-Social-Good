name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pandas==2.3.3 numpy==1.26.4 scipy==1.17.1 scikit-learn==1.9.1 lightgbm==4.7.0 requests==2.34.2 streamlit==1.63.0 plotly==7.0.0

      - name: Lint
        run: ruff check . --select E9,F63,F7,F82

      - name: Test
        run: python -m pytest -q

  dashboard-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exactly the Community Cloud runtime and test tools
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Exercise dashboard without the training stack
        run: python -m pytest tests/test_dashboard.py tests/test_cohort.py -q
